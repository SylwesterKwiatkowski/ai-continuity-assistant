name: CI

on:
  push:
    branches: [main, mvp, post-mvp]
  pull_request:
    branches: [main, mvp, post-mvp]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy strict)
        run: mypy src

      - name: Tests (incl. security acceptance suite)
        run: pytest -q
